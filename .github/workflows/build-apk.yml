name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-levels: '34'
          build-tools: '34.0.0'
          target: android-34

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Flet SDK
        uses: actions/cache@v4
        with:
          path: ~/.flet
          key: flet-sdk-${{ runner.os }}-${{ hashFiles('app/requirements.txt') }}
          restore-keys: flet-sdk-${{ runner.os }}-

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.86.5 paho-mqtt

      - name: Build APK with Flet
        working-directory: app
        run: |
          # flet 在找不到正确 Flutter 时会交互式询问,用 echo y 自动确认
          # flet 会自己下载它需要的 Flutter SDK 版本
          echo "y" | flet build apk
          echo "--- APK files ---"
          find build -name "*.apk" 2>/dev/null
          echo "--- app directory ---"
          ls -la

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jdq-app-apk
          path: app/build/apk/**/*.apk
          retention-days: 30
